# Builds the in-game code and the Windows package.
# Every run uploads the package as a workflow artifact; pushing a tag like v0.1.0, or running
# the workflow by hand with "release" ticked, also attaches it to a GitHub release.
name: Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release v<version> (from lua/b2mmo.lua) of this commit
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 zip

      - name: Build
        run: bash scripts/build.sh

      - name: Package
        run: |
          bash scripts/package.sh
          echo "PKG=$(basename dist/*-windows.zip .zip)" >> "$GITHUB_ENV"
          echo "VER=$(sed -n 's/^local VERSION = "\(.*\)"/\1/p' lua/b2mmo.lua)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VER) }}
          target_commitish: ${{ github.sha }}
          files: dist/${{ env.PKG }}.zip
